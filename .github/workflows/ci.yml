name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: no devtools overlay in the bundle
        run: |
          # The runtime mentions `foldkit-devtools` as an element id; the overlay
          # itself registers `__setDevToolsOverlay`. Only the latter shipping is a leak.
          if grep -rq "__setDevToolsOverlay" dist; then
            echo "devtools overlay leaked into dist"; exit 1
          fi

  desktop:
    name: desktop (tauri build, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: build installer
        run: npm run tauri build

      # The e2e drives the real window, so it needs a desktop session: GitHub's
      # Windows runners have one. It is a gate now — a red e2e fails the build,
      # which is what makes it worth the minutes. Proven by a deliberately
      # broken assertion in the branch that added this step.
      - name: e2e gate (window, keyboard, scroll, hunks)
        shell: bash
        run: |
          # WebView2 >= 150 ignores --remote-debugging-port from the command line,
          # HKCU and WEBVIEW2_* env vars when the host process is elevated — which
          # GitHub's runners are. The HKLM policy is the one override that survives
          # (Microsoft's elevated-host hardening, WebView2Feedback#5645); without it
          # msedgedriver never finds the DevTools port and session creation fails
          # with "DevToolsActivePort file doesn't exist".
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" /v kwdiff.exe /t REG_SZ /d "--remote-debugging-port=0" /f
          cargo install tauri-driver --locked
          WEBVIEW=$(powershell -NoProfile -Command "(Get-Item 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe' | Select-Object -First 1).VersionInfo.ProductVersion")
          curl -sSL -o ed.zip "https://msedgedriver.microsoft.com/${WEBVIEW}/edgedriver_win64.zip"
          unzip -o -q ed.zip
          echo "WebView2 runtime: ${WEBVIEW}"
          ./msedgedriver.exe --version
          export MSEDGEDRIVER="$(pwd)\msedgedriver.exe"
          export PATH="$HOME/.cargo/bin:$PATH"
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: kwdiff-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
